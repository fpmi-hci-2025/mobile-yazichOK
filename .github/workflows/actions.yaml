name: Mobile

on:
  push:
    branches: [ main, dev, production ]
  pull_request:
    branches: [ main, dev, production ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and run tests
        run: |
          xcodebuild -project YazichOK/EnglishApp.xcodeproj \
                     -scheme EnglishApp \
                     -sdk iphonesimulator \
                     -destination 'platform=iOS Simulator,name=iPhone 16' \
                     clean test -only-testing:EnglishAppTests


